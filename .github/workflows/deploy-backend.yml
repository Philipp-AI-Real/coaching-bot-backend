name: Deploy backend

# Build on GitHub's runners, push to GHCR, then SSH to the server which only
# pulls + restarts (no server-side build). Migrations run from the container
# entrypoint (CMD: prisma migrate deploy && node dist/main.js).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/philipp-ai-real/coaching-bot-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER || 'root' }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            # Fresh GHCR login with this run's GITHUB_TOKEN (no PAT, never expires).
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /opt/coaching-bot-backend
            git fetch --prune origin
            git reset --hard origin/main
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull app
            docker compose up -d           # db + qdrant + app; entrypoint runs prisma migrate deploy
            echo "Health-Check auf localhost:3006/health ..."
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null http://localhost:3006/health && { echo "up ($i)"; exit 0; }
              echo "warte ($i/30)"; sleep 2
            done
            echo "Health-Check fehlgeschlagen."; docker compose logs app --tail 80; exit 1

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: coaching-bot-backend
          package-type: container
          min-versions-to-keep: 10
